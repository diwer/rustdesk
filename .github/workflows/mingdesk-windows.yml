name: MingDesk Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'mingdesk-win-*'

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VERSION: "1.5.3"

jobs:
  bridge:
    name: bridge (3.22.3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build:
    name: Windows x64
    runs-on: windows-2022
    needs: [bridge]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $flutterBin = (Get-Command flutter).Source
          $root = Split-Path -Parent (Split-Path -Parent $flutterBin)
          Write-Host "Flutter root: $root"
          $dest = Join-Path $root "bin/cache/artifacts/engine/windows-x64-release"
          if (-not (Test-Path $dest)) { throw "engine dir not found: $dest" }
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release -Force
          Copy-Item -Path windows-x64-release/* -Destination $dest -Recurse -Force
          Get-ChildItem $dest | Select-Object -First 6 -ExpandProperty Name

      - name: Patch flutter
        shell: bash
        run: |
          ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "flutter root: $ROOT"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$ROOT/"
          cd "$ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build MingDesk
        # No --skip-portable-pack: that flag is what turns the output into the
        # self-extracting *-install.exe. Without it build.py runs
        # libs/portable/generate.py, compresses the Flutter bundle into the packer
        # and emits MingDesk-<version>-install.exe.
        run: python .\build.py --portable --flutter --hwcodec --vram

      - name: Package installer and portable
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Filter "*-install.exe" | Select-Object -First 1
          if (-not $installer) { throw "installer not produced" }
          Write-Host "Installer: $($installer.Name)"
          "{0:N1} MB" -f ($installer.Length / 1MB)
          # Keep the name ENDING IN "install.exe": libs/portable/src/main.rs decides
          # between "install me" and "run the app" with
          #   click_setup = args.is_empty() && exe_path.ends_with("install.exe")
          # so renaming to "-installer.exe" makes it skip installation and just
          # launch the tool (it even lacks an extraction dir, so nothing happens).
          Copy-Item $installer.FullName "MingDesk-windows-x64-install.exe"
          # Keep the portable bundle too, so the user can pick either form.
          $rel = "flutter/build/windows/x64/runner/Release"
          Compress-Archive -Path "$rel/*" -DestinationPath "MingDesk-windows-x64-portable.zip" -Force

      - name: Prepare MSI dist directory
        # preprocess.py reads <app-name>.exe and expects the Flutter bundle laid out
        # under a directory it is told about. The bundle already contains
        # MingDesk.exe (BINARY_NAME in flutter/windows/CMakeLists.txt), which is
        # exactly the name --app-name MingDesk makes it look for. usbmmidd and the
        # printer driver are optional payload the stock MSI installs; skipped here
        # since this build has no printer-driver integration.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\rustdesk | Out-Null
          Copy-Item -Recurse -Force flutter\build\windows\x64\runner\Release\* .\rustdesk\
          Get-ChildItem .\rustdesk | Select-Object -ExpandProperty Name | Write-Host
          Test-Path .\rustdesk\MingDesk.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Build MSI
        # preprocess.py rewrites res/msi in place (license, language tables,
        # component GUIDs, build vars), so this must run after the portable pack.
        shell: pwsh
        run: |
          pushd ./res/msi
          # preprocess.py fills Includes.wxi's <!--$PreVarsStart$--> block with
          # $(var.Product)/$(var.Version)/... Without those definitions WiX fails
          # with 65 "Undefined preprocessor variable" errors, so treat any
          # preprocess failure as fatal and verify the variables landed.
          python preprocess.py --arp -d ../../rustdesk --app-name MingDesk `
            --manufacturer "MingDesk"
          if ($LASTEXITCODE -ne 0) { throw "preprocess.py failed ($LASTEXITCODE)" }
          $vars = Get-Content ./Package/Includes.wxi -Raw
          if ($vars -notmatch 'define Product="MingDesk"') {
            Write-Host $vars
            throw "Includes.wxi was not populated with the product variables"
          }
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw "Package.msi not found" }
          Write-Host "MSI: $($msi.FullName)"
          "{0:N1} MB" -f ($msi.Length / 1MB)
          Copy-Item $msi.FullName "$env:GITHUB_WORKSPACE\MingDesk-windows-x64.msi"
          popd

      - uses: actions/upload-artifact@v4
        with:
          name: MingDesk-windows-x64
          path: |
            MingDesk-windows-x64-install.exe
            MingDesk-windows-x64.msi
            MingDesk-windows-x64-portable.zip
