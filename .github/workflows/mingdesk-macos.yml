name: MingDesk macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'mingdesk-mac-*'

env:
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_RUST_VERSION: "1.75"

jobs:
  bridge:
    name: bridge (${{ matrix.flutter }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { flutter: "3.22.3", artifact: "bridge-artifact" }
          - { flutter: "3.44.8", artifact: "bridge-artifact-flutter-3.44" }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          if [[ "${{ matrix.flutter }}" == "3.22.3" ]]; then
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          else
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          fi
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build:
    name: macOS ${{ matrix.arch }}
    needs: [bridge]
    # Probed on this fork: macos-13/macos-14 are never acquired, macos-26 is
    # cancelled for capacity. macos-15 (arm64) and macos-15-intel (x86_64) are
    # the only labels that allocate, and even those are best-effort, so this is
    # a matrix with fail-fast disabled: the x86_64 slice (runs on Apple Silicon
    # via Rosetta) is the guaranteed deliverable.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            flutter: "3.24.5"
            bridge: bridge-artifact
            extra: ""
            triplet: x64-osx
          - arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            flutter: "3.44.9"
            bridge: bridge-artifact-flutter-3.44
            extra: "--screencapturekit"
            triplet: arm64-osx
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.bridge }}
          path: ./

      - name: Install build runtime
        run: |
          brew install llvm create-dmg gnu-sed
          command -v pkg-config || brew install pkg-config

      - name: Install NASM 2.16.03
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -o nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}

      - name: Configure flutter
        if: ${{ matrix.arch == 'arm64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch RustDesk sources for Flutter 3.44
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        run: |
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-${{ matrix.arch }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
        run: $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.triplet }} --x-install-root="$VCPKG_ROOT/installed"

      - name: Build MingDesk
        shell: bash
        run: |
          set -euo pipefail
          MIN_MACOS_VERSION="12.3"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then MIN_MACOS_VERSION="10.15"; fi
          sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET=[0-9]*\.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i '' -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i '' -e "s/osx_minimum_system_version = \"[0-9]*\.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i '' -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*\.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.extra }}

      - name: Package app
        run: |
          cd flutter/build/macos/Build/Products/Release
          ls -la
          ditto -c -k --sequesterRsrc --keepParent MingDesk.app "$GITHUB_WORKSPACE/MingDesk-macos-${{ matrix.arch }}.zip"
          du -sh "$GITHUB_WORKSPACE/MingDesk-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MingDesk-macos-${{ matrix.arch }}
          path: MingDesk-macos-${{ matrix.arch }}.zip
